# Docs-only deployment.
#
# Publishes the documentation to GitHub Pages and nothing else: no firmware
# build, no ESP-IDF, no torch, no container, no release. The whole job is a
# `pip install mkdocs-material` and a static site generation, which is why it is
# separated from the application pipeline in the first place - a typo fix should
# not queue behind a 16 MB firmware build.
#
# One exception, and it is a download rather than a build: the firmware assets from
# the most recent release are copied into `site/firmware/` so the browser installer
# on getting-started/install-esp32.md fetches its manifest from the same origin it
# was served from. Cross-origin would work only for as long as whatever CDN serves
# release assets keeps sending a permissive CORS header - not something this
# repository controls, tests, or would find out about until a visitor's install
# silently failed. The step is best-effort: with no release published the page says
# so and points at the manual route, which is strictly better than failing the
# documentation deployment over it.
#
# The build and deploy steps are separate jobs on purpose: `deploy` only runs if
# `build` succeeded, so a documentation build that fails validation leaves the
# previously published site untouched rather than replacing it with a broken one.

name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "plxy.sh"
      - ".github/workflows/docs-deploy.yml"
  # A new firmware release changes what the browser installer should serve, and
  # nothing under docs/ has to change for that to be true - so the deployment is
  # re-run when the firmware workflow finishes. Without this the installer would
  # keep offering the previous release until somebody happened to edit a page.
  #
  # `v*` alongside `main` is not redundant. This filter matches the *triggering* run's
  # head_branch, and a release is published by pushing a tag - for which head_branch
  # is the tag name, not the branch the tag points at. With `main` alone the release
  # that the installer exists to serve would be the one release that never reached it,
  # and the symptom would be an install page still reporting http 404 hours after a
  # green release run.
  workflow_run:
    workflows: ["Build and publish firmware"]
    types: [completed]
    branches: [main, "v*"]
  workflow_dispatch:

# Minimum required to publish Pages. Notably absent: `contents: write` - this
# workflow never pushes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. `cancel-in-progress: false` because cancelling
# a Pages deployment half way is how a site ends up in a partial state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Use the runner's interpreter; ./plxy.sh must not build a .venv-docs here.
  PLXY_DOCS_NO_VENV: "1"

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Deliberately the same entry point developers run locally, so a green CI
      # run and a green `./plxy.sh docs-check` mean the same thing. It performs
      # the strict build (broken links, missing anchors, unresolved nav entries,
      # missing assets, duplicate routes) and the credential scan, then writes
      # the static site to site/.
      #
      # `bash ./plxy.sh`, not `./plxy.sh`: this repository is developed on Windows
      # with core.filemode=false, where the working tree reports every file as
      # executable regardless of what git actually records. A script can lose its
      # +x bit in the index without anyone seeing it locally, and the runner then
      # fails with "Permission denied" (exit 126). Going through bash does not
      # care about the bit.
      - name: Build documentation (docs-only)
        run: bash ./plxy.sh docs-build

      # After the site is built, so it lands in the output tree, and before the
      # upload. `|| true` on the download: a repository with no release yet is a
      # normal state, not a documentation failure.
      - name: Attach the published firmware to the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p site/firmware
          if gh release download --repo "$GITHUB_REPOSITORY" \
               --pattern 'manifest.json' \
               --pattern 'flash-offsets.json' \
               --pattern '*-merged.bin' \
               --dir site/firmware --clobber; then
            echo "firmware assets published alongside the docs:"
            ls -l site/firmware
          else
            echo "no firmware release to attach; the install page will say so"
            rmdir site/firmware 2>/dev/null || true
          fi

      - name: Report the installer state
        run: |
          {
            echo "## Browser installer"
            echo
            if [ -f site/firmware/manifest.json ]; then
              echo "| | |"
              echo "| --- | --- |"
              echo "| Manifest | :white_check_mark: published |"
              echo "| Version | \`$(python -c "import json;print(json.load(open('site/firmware/manifest.json'))['version'])")\` |"
              echo "| Images | $(ls site/firmware | tr '\n' ' ') |"
            else
              echo "No firmware release found, so the install page will explain that"
              echo "and point at the manual flashing route. Publish one by pushing a"
              echo "\`v*\` tag, which runs the firmware-release workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Report build result
        run: |
          {
            echo "## Documentation build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Status | :white_check_mark: validated and built |"
            echo "| Pages | $(find site -name '*.html' | wc -l) |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Built at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment result
        run: |
          {
            echo "## Documentation deployed"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Status | :rocket: published |"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Deployed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
