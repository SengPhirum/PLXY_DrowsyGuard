[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsyguard"
version = "0.1.0"
description = "Microcontroller-first driver drowsiness detection research toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "scikit-learn>=1.4",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "tqdm>=4.66",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
live = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# Everything the test suite needs beyond the runtime dependencies.
#
# ziglang is a C++ compiler as a wheel. That is the whole point: several tests
# compile firmware/esp32s3/main/*.cpp on the host and drive it against the Python
# implementations, and requiring a system toolchain would mean those tests were
# skipped on most machines - which for a parity check is the same as not having one.
#
# esptool is what merges the flash images for the browser installer. It ships with
# ESP-IDF, so a firmware developer already has it; listed here so the installer tests
# run on a checkout that has never seen ESP-IDF.
dev = [
  "pytest>=8.0",
  "ziglang>=0.13",
  "esptool>=4.7",
]

[project.scripts]
drowsyguard = "drowsyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drowsyguard = ["static/*"]
