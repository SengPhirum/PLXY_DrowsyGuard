# Documentation site for DrowsyGuard.
#
# This file is the *only* input the docs-only build needs. Nothing here reads the
# firmware, the training pipeline or the Python package, which is what lets
# `./plxy.sh docs-build` run without ESP-IDF, torch, or a board attached.
#
# Warnings are not turned into errors here on purpose: `docs-preview` would then
# refuse to start over a link you are halfway through typing. `docs-build` and
# `docs-check` pass --strict instead, so CI still fails on anything below.

site_name: DrowsyGuard
site_description: >-
  Camera-based driver drowsiness detection on an ESP32-S3 - firmware, training
  toolkit, hardware build and operations manual.
site_author: Seng Phirum
# `mkdocs serve` mounts the site under this URL's path, so a hard-coded
# site_url would put the local preview at /PLXY_DrowsyGuard/ instead of /.
# docs-preview overrides it with the local address; a fork can point it at its
# own Pages URL without editing this file.
site_url: !ENV [PLXY_DOCS_SITE_URL, "https://sengphirum.github.io/PLXY_DrowsyGuard/"]

repo_url: https://github.com/SengPhirum/PLXY_DrowsyGuard
repo_name: SengPhirum/PLXY_DrowsyGuard
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Task briefs are working notes, not product documentation.
exclude_docs: |
  prompts/

theme:
  name: material
  language: en
  logo: assets/brand/drowsyguard-logo.webp
  favicon: assets/brand/favicon.png
  icon:
    repo: fontawesome/brands/github
  # Roboto is the theme default. Inter has a larger x-height, which is what the
  # full-width layout needs to stay readable at a long line length, and
  # JetBrains Mono disambiguates 0/O and 1/l/I - this site is mostly GPIO
  # numbers, hex boot modes and thresholds.
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    # Turns the site into a single-page app: the header, nav and search index
    # survive a click, so moving between pages no longer reloads the whole
    # theme. Requires site_url, which is set above.
    - navigation.instant
    - navigation.instant.progress
    # Keeps the address bar on the section you are actually reading, so a URL
    # copied out of the browser points at the anchor rather than the page top.
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.tooltips
  palette:
    # primary/accent are repeated here, not just on the two entries below: this
    # is the palette a first-time visitor gets, and an entry that omits them
    # falls back to Material's stock indigo rather than inheriting anything.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Defines the dodgerblue primary that `primary: custom` above refers to.
extra_css:
  - stylesheets/extra.css

plugins:
  - search

# Every one of these is a build failure under --strict, which is how
# `docs-check` catches a bad link before it reaches the published site.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  # Without this, the `:material-rocket-launch:` shortcodes on the overview and
  # getting-started pages render as literal text rather than icons - MkDocs does
  # not warn about it, so --strict cannot catch it. The index/generator pair is
  # what resolves Material's own icon sets (material, octicons, fontawesome,
  # simple) and inlines them as SVG instead of loading a sprite sheet.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SengPhirum/PLXY_DrowsyGuard
      name: DrowsyGuard on GitHub
  generator: false

copyright: >-
  Research prototype. Not a certified automotive safety device.

nav:
  - Overview:
      - index.md
      - Research proposal: research-proposal.md
      - Thesis plan: THESIS_PLAN.md
  - Getting started:
      - getting-started/index.md
      - Install the toolkit: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User manual:
      - guide/index.md
      - Hardware build:
          - Hardware setup tutorial: tutorials/hardware-setup/README.md
          - Toolchain and firmware install: HARDWARE_SETUP.md
          - Voice alert hardware: VOICE_ALERT_HARDWARE.md
      - Working with the device:
          - Firmware dev loop: guide/dev-loop.md
          - Using the device: guide/device.md
      - Desktop toolkit:
          - Live dashboard: guide/live-dashboard.md
          - Datasets: guide/datasets.md
          - Training and export: guide/training.md
  - Configuration:
      - configuration/index.md
  - API reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Device HTTP API: reference/device-api.md
      - Dashboard HTTP API: reference/dashboard-api.md
      - Python modules: reference/python-api.md
  - Operations:
      - operations/index.md
      - Deployment: DEPLOYMENT.md
      - On-device pipeline: FIRMWARE_PIPELINE.md
      - Documentation pipeline: operations/documentation.md
      - Handoff protocol: AI_HANDOFF.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
